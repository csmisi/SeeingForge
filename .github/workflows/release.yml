name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: "6.8.3"

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install LibRaw
        run: sudo apt-get update && sudo apt-get install -y libraw-dev
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install AppImage packaging tools
        run: |
          mkdir -p packaging-tools
          curl -L --fail --retry 3 -o packaging-tools/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L --fail --retry 3 -o packaging-tools/linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x packaging-tools/*.AppImage
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          OUTPUT: SeeingForge-${{ github.ref_name }}-linux-x86_64.AppImage
        run: |
          export PATH="$GITHUB_WORKSPACE/packaging-tools:$PATH"
          linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable build/SeeingForge \
            --desktop-file packaging/SeeingForge.desktop \
            --icon-file packaging/seeingforge.svg \
            --plugin qt \
            --output appimage
      - name: Verify Qt platform plugins
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ./SeeingForge-${{ github.ref_name }}-linux-x86_64.AppImage --appimage-extract
          test -f squashfs-root/usr/plugins/platforms/libqxcb.so
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: seeingforge-linux-x64
          path: SeeingForge-${{ github.ref_name }}-linux-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install LibRaw
        run: vcpkg install libraw:x64-windows
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install deployable application
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/stage"
      - name: Bundle LibRaw runtime dependencies
        shell: pwsh
        run: |
          Copy-Item C:\vcpkg\installed\x64-windows\bin\*.dll stage\bin\
          if (-not (Test-Path stage\bin\raw_r.dll)) {
            throw "raw_r.dll was not included in the Windows package"
          }
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path stage\* -DestinationPath SeeingForge-${{ github.ref_name }}-windows-x64.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: seeingforge-windows-x64
          path: SeeingForge-${{ github.ref_name }}-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS Intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install LibRaw
        run: brew install libraw
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install deployable application
        run: cmake --install build --prefix "$GITHUB_WORKSPACE/stage"
      - name: Ad-hoc sign application bundle
        run: codesign --force --deep --sign - stage/SeeingForge.app
      - name: Package disk image
        shell: bash
        run: |
          output="SeeingForge-${{ github.ref_name }}-macos-intel.dmg"
          for attempt in 1 2 3; do
            rm -f "$output"
            if hdiutil create -volname SeeingForge -srcfolder stage/SeeingForge.app -ov -format UDZO "$output"; then
              exit 0
            fi
            hdiutil detach /Volumes/SeeingForge -force || true
            sleep 10
          done
          exit 1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: seeingforge-macos-intel
          path: SeeingForge-${{ github.ref_name }}-macos-intel.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: seeingforge-*
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          artifacts/*
          --repo "${GITHUB_REPOSITORY}"
          --title "SeeingForge ${GITHUB_REF_NAME}"
          --generate-notes
